<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>News</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light dark">

<style>
  /* Light is the default; [data-theme="dark"] on <html> flips it. The --panel /
     --ink / --line / --ink-soft / --accent-soft names are the ones the shared
     interpret widget reads, so the drawer and popup follow the theme too. */
  :root {
    --nfs: 17px;
    color-scheme: light;
    --bg: #fff; --fg: #111; --hdr: rgba(255,255,255,.92);
    --line: #eee; --btn-bd: #ccc; --src: #777; --dt: #aaa; --status: #999;
    --panel: #fff; --ink: #111; --ink-soft: #555; --accent-soft: #eee;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121212; --fg: #e6e6e6; --hdr: rgba(18,18,18,.92);
    --line: #2b2b2b; --btn-bd: #4a4a4a; --src: #9a9a9a; --dt: #6f6f6f; --status: #8a8a8a;
    --panel: #1c1c1c; --ink: #e6e6e6; --ink-soft: #a8a8a8; --accent-soft: #2e2e2e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    line-height: 1.5;
    padding: max(12px, env(safe-area-inset-top)) 15px calc(40px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--hdr); backdrop-filter: blur(6px);
    display: flex; align-items: center; gap: 8px; padding: 8px 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 4px;
  }
  header h1 { font-size: 19px; font-weight: 800; flex: 1; letter-spacing: .02em; }
  .hb { border: 1px solid var(--btn-bd); background: var(--panel); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 700; color: var(--fg); min-width: 34px; }
  /* 回桌面版的入口(只在电脑浏览器上显示, 见下方 JS)。<a> 需要 inline-block 才吃 min-width,
     所以 [hidden] 要显式压回 display:none, 否则默认隐藏会失效。 */
  a.hb { display: inline-block; text-align: center; text-decoration: none; }
  a.hb[hidden] { display: none; }

  ul { list-style: none; }
  /* title fills full width on every line; the buttons float right onto the LAST line
     (right-aligned, same line as the title's end) — no wasted space */
  li { padding: 9px 2px; border-bottom: 1px solid var(--line); line-height: 1.55; overflow: hidden; }  /* overflow:hidden contains the float */
  .src { font-size: .72em; font-weight: 800; letter-spacing: .06em; color: var(--src); margin-right: 6px; vertical-align: 1px; }
  .date { font-size: .72em; color: var(--dt); margin-left: 6px; white-space: nowrap; }
  .ti { font-size: var(--nfs); user-select: text; overflow-wrap: anywhere; }
  .btns { float: right; margin-left: 10px; white-space: nowrap; }   /* read + del, right-aligned on the last line */
  /* read & del share the same button style so delete isn't a stray glyph you mis-tap */
  /* 三个都是图标了(✨解读 / 📖阅读 / 🗑删除)。emoji 宽度各不相同, 所以用 min-width +
     居中把三个按钮撑成一样大, 免得一排看着参差不齐; 字号比原来的文字略大好点。 */
  .go, .x, .ex { display: inline-block; border: 1px solid var(--fg); border-radius: 6px; padding: 1px 6px; margin-left: 8px; min-width: 2.2em; text-align: center; font-size: 15px; line-height: 1.45; font-weight: 700; text-decoration: none; color: var(--fg); white-space: nowrap; vertical-align: 1px; }
  /* 删除离另外两个远一点: 三个图标一样大又挨着, 拇指最容易在 📖 旁边点到 🗑。
     防误触只用这两招: 拉开距离(事前) + 表头 ♻ 里恢复(事后)。
     刻意不做二次确认, 也刻意不在删完弹提示 —— 每次删都要多看一眼太干扰。 */
  .x { margin-left: 18px; }
  .status { text-align: center; color: var(--status); margin-top: 22vh; font-size: 15px; }


  /* 回收站: 最近删除, 每条一个「恢复」 */
  #trashbox {
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    margin: 6px 0 10px; background: var(--panel); font-size: 13.5px;
  }
  #trashbox[hidden] { display: none; }
  #trashbox h2 { font-size: 13.5px; font-weight: 800; margin-bottom: 8px; display: flex; gap: 8px; }
  #trashbox h2 .cls { margin-left: auto; cursor: pointer; color: var(--status); }
  #trashbox .row { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); }
  #trashbox .row .ago { color: var(--status); font-size: 11.5px; white-space: nowrap; flex: none; }
  #trashbox .row .tt { flex: 1; overflow-wrap: anywhere; }
  #trashbox .row .rs { flex: none; border: 1px solid var(--fg); border-radius: 6px;
                       padding: 1px 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
  #trashbox .empty { color: var(--status); }
  a, button, .x, .go, .ex { touch-action: manipulation; }
</style>
</head>
<body>
  <header>
    <h1>📰 News</h1>
    <a id="todesk" class="hb" href="/index.html" title="切换到桌面版" hidden>桌面版</a>
    <button id="trash" class="hb" title="最近删除（可恢复）">♻</button>
    <button id="refresh" class="hb" title="刷新">↻</button>
    <button id="gear" class="hb nrw-gear" title="设置（模型 / 字号 / 显示模式）">⚙</button>
  </header>
  <div id="trashbox" hidden></div>
  <ul id="list"></ul>
  <div class="status" id="status">加载中…</div>

  <!-- only the interpret widget is loaded from the reader; no weather/radar/calendar traffic -->
  <script>window.INTERPRET_BASE = '';</script>
  <script src="/static/interpret-widget.js?v=20260901a"></script>
  <script>
  const $ = s => document.querySelector(s), list = $('#list'), status = $('#status');
  let items = [];
  const esc = s => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;');

  // font size (persisted), applied to the news titles via --nfs
  const FS_KEY = 'news_fs', FMIN = 12, FMAX = 30;
  const fsGet = () => Math.max(FMIN, Math.min(FMAX, parseInt(localStorage.getItem(FS_KEY) || '17', 10)));
  const fsSet = px => { px = Math.max(FMIN, Math.min(FMAX, px)); localStorage.setItem(FS_KEY, px); document.documentElement.style.setProperty('--nfs', px + 'px'); };
  fsSet(fsGet());

  // display mode: font size + light/dark now live in the shared ⚙ menu (Interpret.settings).
  // Here we only apply the saved/OS theme on load; the gear writes news_theme and flips
  // data-theme live, so no toggle button is needed on this page anymore.
  const TH_KEY = 'news_theme';
  const th0 = localStorage.getItem(TH_KEY)
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = th0;
  const _m = document.querySelector('meta[name=theme-color]');
  if (_m) _m.content = th0 === 'dark' ? '#121212' : '#ffffff';

  $('#gear').onclick = () => window.Interpret && Interpret.settings();

  // 在电脑浏览器上看手机版时, 给一个回桌面版的入口; 真手机上不显示, 免得误触跳到墨水屏那版。
  const isPhoneUA = /Mobile|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
    || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  if (!isPhoneUA) $('#todesk').hidden = false;

  async function load(refresh) {
    status.style.display = 'block';
    status.textContent = refresh ? '刷新中…' : '加载中…';
    try {
      const r = await fetch('/news', { cache: 'no-store' });
      items = (await r.json()).items || [];
      render();
    } catch (e) { status.textContent = '加载失败：' + e.message; }
  }
  const rowKey = it => it.link || it.title;
  const rows = new Map();   // key -> <li>, 用来做增量渲染

  function liFor(it) {
    const li = document.createElement('li');
    li.innerHTML =
        // the space between .src and .ti is load-bearing: without a whitespace text
        // node the browser treats "BBC" + the first title word as ONE word, so a
        // long-press selects the source label too and the anchor lands outside .ti
        `<span class="src">${esc(it.source)}</span> ` +
        `<span class="ti">${esc(it.title)}</span> ` +
        (it.date ? ` <span class="date">${esc(it.date)}</span>` : '') +
        '<span class="btns">' +
          `<span class="ex" role="button" title="解读整条标题" aria-label="解读">✨</span>` +
          (it.link ? `<a class="go" href="/reader/?u=${encodeURIComponent(it.link)}" target="_blank" rel="noopener" title="阅读原文" aria-label="阅读">📖</a>` : '') +
          `<span class="x" role="button" data-k="${encodeURIComponent(rowKey(it))}" title="删除" aria-label="删除">🗑</span>` +
        '</span>';
    return li;
  }

  // 增量渲染: 已经在页面上的行原样保留, 只做增 / 删 / 重排。
  // 不能整块重写 innerHTML —— 那会连行内的解读状态点(.nrw-mk)一起抹掉, 正在流式输出的
  // 会话就失去了重新打开的入口; 长按选中的选区也会被清掉。刷新(手动 ↻、恢复条目、
  // 每 20 分钟的自动刷新)都会走到这里, 所以这里必须是非破坏性的。
  function render() {
    if (!items.length) {
      rows.clear(); list.innerHTML = '';
      status.textContent = '暂无新闻'; status.style.display = 'block'; return;
    }
    status.style.display = 'none';
    const want = new Set(items.map(rowKey));
    for (const [k, li] of rows) {          // 已经不在列表里的行: 摘掉
      if (!want.has(k)) { li.remove(); rows.delete(k); }
    }
    items.forEach((it, i) => {             // 缺的补上, 顺序不对的挪到位
      const k = rowKey(it);
      let li = rows.get(k);
      if (!li) { li = liFor(it); rows.set(k, li); }
      if (list.children[i] !== li) list.insertBefore(li, list.children[i] || null);
    });
  }
  // ✨ = 等价于把整条标题选中再点弹窗里的 ✨解读, 只是省掉长按选中那一步。
  // 标题从 DOM 现取, 不用 items 下标: del 只 filter 了 items 并移除那个 li, 没有重新
  // render, 剩下的行还挂着旧下标, 用下标会取错条目。
  // 不用自己管去重: widget 按 mode+文字+上下文 自动认会话, 连点只会把已有结果重新打开。
  // anchor 必须传 —— 否则 marker 会去找上一次的选区, 落到毫无关系的位置。
  // anchor 给 .ti(标题)而不是按钮: 挂在按钮后面的话, 小红点被夹在 ✨ 和 📖 中间, 太挤,
  // 手指根本点不到。挂在标题末尾就有整行的空地, 和选中文字时红点出现在文字处也一致。
  list.addEventListener('click', e => {
    const b = e.target.closest('.ex'); if (!b) return;
    const li = b.closest('li'), ti = li && li.querySelector('.ti');
    const title = ti ? ti.textContent.trim() : '';
    if (!title || !window.Interpret) return;
    // deferred=true: 后台跑, 不弹抽屉 —— 你可能正在看别的条目, 抽屉一弹就挡住了。
    // 标题后面的小红点会转成绿色闪(解读中)/红色(可看); 点红点、或者再点一次 ✨ 都能打开看。
    Interpret.open({ text: title, title: title, context: title, anchor: ti }, true, 'interpret');
  });

  // 🗑 dismiss (persisted on the server)。删完**不提示** —— 每次删都弹一条太干扰,
  // 而且删除本来就不丢数据(只是把它从 /news 里过滤掉)。误删就去表头的 ♻ 里恢复。
  // title/source/date 一起 POST 过去: 回收站要靠它们显示"删掉的是哪一条", 否则只剩 URL。
  list.addEventListener('click', e => {
    const b = e.target.closest('.x'); if (!b) return;
    const li = b.closest('li'), ti = li.querySelector('.ti');
    const key = decodeURIComponent(b.dataset.k);
    const it = items.find(x => (x.link || x.title) === key);
    fetch('/dismiss', { method: 'POST', body: JSON.stringify({
      key,
      title: it ? it.title : (ti ? ti.textContent.trim() : ''),
      source: it ? it.source : '',
      date: it ? (it.date || '') : '',
    }) });
    items = items.filter(x => (x.link || x.title) !== key);
    rows.delete(key);
    li.remove();   // 只摘这一行, 不重新 render(其他行的解读 marker 才不会没)
  });

  // ♻ 回收站: 最近删除, 每条一个「恢复」。这是误删的唯一找回入口。
  // 服务端只返回有删除时间的条目, 所以这里不必再有"时间未知"这种兜底文案。
  // 万一标题也缺(仪表盘的 ✕ 不带标题, 且已不在 feed 缓存里), 就退化成 URL 尾段 ——
  // 显示点真东西, 也比"（无标题记录）"这种像故障的占位符好。
  const shortKey = k => { try { return decodeURIComponent(k).split('/').filter(Boolean).pop().slice(0, 60); } catch (e) { return k.slice(0, 60); } };
  const ago = ts => {
    const s = Math.max(0, Date.now() / 1000 - ts);
    if (s < 60) return Math.round(s) + ' 秒前';
    if (s < 3600) return Math.round(s / 60) + ' 分钟前';
    if (s < 86400) return Math.round(s / 3600) + ' 小时前';
    return Math.round(s / 86400) + ' 天前';
  };
  const box = $('#trashbox');
  async function openTrash() {
    box.hidden = false;
    box.innerHTML = '<h2>最近删除<span class="cls">关闭</span></h2><div class="empty">读取中…</div>';
    box.querySelector('.cls').onclick = () => { box.hidden = true; };
    let rows = [];
    try { rows = (await (await fetch('/dismissed', { cache: 'no-store' })).json()).items || []; }
    catch (e) { box.querySelector('.empty').textContent = '读取失败：' + e.message; return; }
    // 只看最近 10 条: 误删都是刚发生的事, 更早的翻出来也没用, 列表短才扫得快。
    // 不足 10 条就只显示实有的几条 —— 绝不用占位行填满, 那看着像 bug。
    const shown = rows.slice(0, 10), more = rows.length - shown.length;
    const head = `<h2>最近删除${shown.length ? ' · ' + shown.length + ' 条' : ''}` +
      (more > 0 ? `<span class="ago">（另有 ${more} 条更早）</span>` : '') +
      `<span class="cls">关闭</span></h2>`;
    box.innerHTML = head + (shown.length ? shown.map(r =>
      `<div class="row"><span class="ago">${ago(r.ts)}</span>` +
      `<span class="tt">${esc(r.title) || esc(shortKey(r.key))}` +
      (r.source ? ` <span class="ago">${esc(r.source)}</span>` : '') + `</span>` +
      `<span class="rs" data-k="${encodeURIComponent(r.key)}">恢复</span></div>`
    ).join('') : '<div class="empty">还没有删除过条目</div>');
    box.querySelector('.cls').onclick = () => { box.hidden = true; };
    box.querySelectorAll('.rs').forEach(btn => btn.onclick = async () => {
      btn.textContent = '…';
      await fetch('/undismiss', { method: 'POST', body: JSON.stringify(
        { key: decodeURIComponent(btn.dataset.k) }) });
      box.hidden = true;     // 恢复完就收起面板, 不必留在那儿挡着列表
      await load(true);      // 恢复的条目不在当前 DOM 里; render 是增量的, 不会动其他行
    });
  }
  $('#trash').onclick = () => { box.hidden ? openTrash() : (box.hidden = true); };
  $('#refresh').onclick = () => load(true);

  // select a word/phrase in a title -> shared interpret widget (right drawer + chat)
  function onSel(e) {
    if (e.target.closest && e.target.closest('.nrw-pop')) return;
    setTimeout(() => {
      const sel = window.getSelection(), text = sel.toString().trim();
      if (!text) { window.Interpret && Interpret.hidePopup(); return; }
      // resolve the .ti from either end of the selection: a drag that starts in the
      // source label (or ends past the title) must still find its title
      const up = n => { const e = n && n.nodeType === 3 ? n.parentNode : n; return e && e.closest ? e.closest('.ti') : null; };
      const ti = up(sel.anchorNode) || up(sel.focusNode);
      if (!ti) { window.Interpret && Interpret.hidePopup(); return; }
      const title = ti.textContent.trim();
      const rect = sel.getRangeAt(0).getBoundingClientRect();
      window.Interpret && Interpret.popupAt(rect, { text, title, context: title }, true);
    }, 10);
  }
  document.addEventListener('mouseup', onSel);
  document.addEventListener('touchend', onSel, { passive: true });

  load();
  setInterval(() => { if (!document.hidden) load(true); }, 20 * 60 * 1000);
  </script>
</body>
</html>
