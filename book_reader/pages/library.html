<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>书架</title>
<link rel="icon" href="/static/favicon.ico?v={{V}}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icon-32.png?v={{V}}">
<link rel="apple-touch-icon" href="/static/icon-180.png?v={{V}}">

<style>
:root{
  --bg:#fbfaf7; --panel:#fff; --ink:#1a1a1a; --ink-soft:#6b6b6b; --ink-faint:#a8a49c;
  --line:#e2ded4; --accent-soft:#efece3; --accent:#7a1f1f;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Arial,
    "Noto Sans","PingFang SC","Heiti SC",sans-serif;
}
:root[data-theme=dark]{
  --bg:#121212; --panel:#1a1a1a; --ink:#e6e3dd; --ink-soft:#9b9689; --ink-faint:#6a655c;
  --line:#2e2c28; --accent-soft:#252320; --accent:#d09a9a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
header{display:flex;align-items:baseline;gap:12px;padding:20px 24px 14px;
  border-bottom:1px solid var(--line)}
header h1{font-family:var(--serif);font-size:22px;margin:0;font-weight:700}
header .n{color:var(--ink-faint);font-size:13px}
header .sp{flex:1}
header a,header button{font:inherit;font-size:13px;color:var(--ink);background:none;
  border:1px solid var(--line);border-radius:7px;padding:5px 12px;cursor:pointer;text-decoration:none}
main{max-width:1080px;margin:0 auto;padding:22px 24px 60px}

.shelf{display:grid;gap:26px 20px;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.bk{display:flex;flex-direction:column;text-decoration:none;color:inherit}
.bk .art{position:relative;aspect-ratio:2/3;border-radius:3px;overflow:hidden;
  background:var(--accent-soft);border:1px solid var(--line);
  box-shadow:0 2px 8px rgba(0,0,0,.12);transition:transform .15s ease,box-shadow .15s ease}
.bk:hover .art{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.2)}
/* Covers are deliberately not fetched: a shelf of them is the single largest
   thing this app could ask a phone to download, and the title is what you are
   actually scanning for. The card is set like a spine instead. */
.bk .art .spine{position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:center;padding:16px 14px;font-family:var(--serif);text-align:center;
  background:linear-gradient(150deg,var(--accent-soft),var(--panel))}
.bk .art .spine::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:var(--accent);opacity:.55}
.bk .art .spine b{font-size:15px;line-height:1.38;font-weight:700}
.bk .art .spine i{font-style:normal;font-size:12px;color:var(--ink-soft);margin-top:10px}
.bk .t{font-family:var(--serif);font-size:14.5px;line-height:1.35;margin:9px 0 2px}
.bk .a{font-size:12.5px;color:var(--ink-soft)}
.bk .meta{font-size:11.5px;color:var(--ink-faint);margin-top:3px;font-variant-numeric:tabular-nums}
/* how far in you are, drawn on the cover itself */
.bk .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.12)}
.bk .bar i{display:block;height:100%;background:var(--accent)}
.status{padding:4em 0;text-align:center;color:var(--ink-soft)}
</style>
</head>
<body>
<header>
  <h1>书架</h1><span class="n" id="count"></span>
  <span class="sp"></span>
  <a href="/vocab">📓 生词本</a>
  <button id="rescan">重新扫描</button>
</header>
<main><div id="shelf" class="status">载入中…</div></main>

<script>
const $ = (s) => document.querySelector(s);
document.documentElement.dataset.theme = localStorage.getItem('nrw_theme') ||
  (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
const esc = (s) => (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function card(b, prog){
  const pct = prog && b.chapters ? Math.min(100, (prog.chapter + 1) / b.chapters * 100) : 0;
  const art = `<span class="spine"><b>${esc(b.title)}</b><i>${esc(b.author)}</i></span>`;
  const bar = pct ? `<span class="bar"><i style="width:${pct.toFixed(0)}%"></i></span>` : '';
  const where = prog ? (prog.page ? `读到 p.${esc(prog.page)}` : `第 ${prog.chapter + 1} 节`) : '';
  return `<a class="bk" href="/read?b=${encodeURIComponent(b.id)}">
    <span class="art">${art}${bar}</span>
    <span class="t">${esc(b.title)}</span>
    <span class="a">${esc(b.author)}</span>
    <span class="meta">${b.chapters} 节${where ? ' · ' + where : ''}</span>
  </a>`;
}

async function load(rescan){
  const shelf = $('#shelf');
  try {
    const d = rescan
      ? await (await fetch('/api/books/rescan', {method:'POST'})).json()
      : await (await fetch('/api/books')).json();
    let progress = {};
    try { progress = (await (await fetch('/api/progress')).json()).progress || {}; } catch (_) {}
    const books = d.books || [];
    $('#count').textContent = books.length + ' 本';
    if (!books.length) {
      shelf.className = 'status';
      shelf.textContent = '这个目录里还没有 epub。把书放进去再点「重新扫描」。';
      return;
    }
    shelf.className = 'shelf';
    shelf.innerHTML = books.map(b => card(b, progress[b.id])).join('');
  } catch (e) {
    shelf.className = 'status';
    shelf.textContent = '载入失败：' + e.message;
  }
}
$('#rescan').onclick = () => load(true);
load(false);
</script>
</body>
</html>
